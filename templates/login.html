<html>
    <head>
        <link rel="stylesheet" href="{{url_for('static', filename='css/geral.css')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/estilo.css')}}">
        
    </head>

    <body>

        <form action ="/verificar" method="post">
            <h1 id="titulo">
                Relatório de Estudos</h1>

            <div id="caixa">
                
                
                <label for="email">E-mail:</label>
                    <input 
                    type="email" 
                    name="nemail" 
                    id="email"    
                    required
                    pattern="[a-zA-Z0-9]{4,}@[a-z]{5,}\.[a-z]{3,}"
                    tittle="Formato válido: usuario@email.com"
                    >
                    
               
                <label for="password">Senha:</label>

                    <input 
                    type="password" 
                    name="nsenha" 
                    id="password"
                    required
                    pattern="[A-Za-z0-9@!]{6,}"
                    tittle="Senha muito pequena"
                    >


                <a href="/renderizar_pagina">Não tem uma conta?Clique</a> 

                {%if resultado == False %}

                 <div >Email ou senha incorretos</div>

                {% endif %}
                <button type="submit" id="botao">Enviar</button>
            </div>
         


    </form>

   

    </body>
</html>
